name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start Postgres, Redis and RabbitMQ with Testcontainers; the runner provides Docker.
      - name: Run tests
        working-directory: backend
        run: mvn -B test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check and build
        working-directory: frontend
        run: npm run build
      - name: Waker tests
        working-directory: frontend
        run: node --test waker

  images:
    name: Docker images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$owner" >> "$GITHUB_ENV"
          for app in api web; do
            dir=$([ "$app" = api ] && echo backend || echo frontend)
            docker build "./$dir" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              -t "ghcr.io/$owner/pulsedesk-$app:${{ github.sha }}" \
              -t "ghcr.io/$owner/pulsedesk-$app:latest"
          done
      # Only main publishes; scripts/azure/deploy.ps1 deploys the images tagged with the current commit.
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for app in api web; do
            docker push --all-tags "$REGISTRY/pulsedesk-$app"
          done
